# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🟧 Cache - Redis
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:8.10.1
    container_name: levelup_store_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
      - ${PWD}/docker/config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - app-network
    command: ['redis-server', '/usr/local/etc/redis/redis.conf', '--requirepass', '${REDIS_PASSWORD}']
    extends:
      file: ../../_base/healthcheck.yml
      service: healthcheck-base
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
