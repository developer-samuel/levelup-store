# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🟧 Cache - Redis
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  redis:
    image: redis:latest
    container_name: levelup_store_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
      - ${PWD}/docker/config/redis/config/redis.conf:/usr/local/etc/redis/config/redis.conf
    networks:
      - app-network
    command: ['redis-server', '/usr/local/etc/redis/config/redis.conf']
    extends:
      file: ../../_base/healthcheck.yml
      service: healthcheck-base
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
