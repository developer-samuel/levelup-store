# ──────────────────────────────────────────────────────────────────────────────────────────────
# 📊 Observability - Alertmanager
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: levelup_store_alertmanager
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/config/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - '9093:9093'
    command: --config.file=/etc/alertmanager/alertmanager.yml
    networks:
      - app-network
    depends_on:
      - prometheus
