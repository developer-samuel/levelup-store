# ──────────────────────────────────────────────────────────────────────────────────────────────
# 📊 Observability - Prometheus + Loki + Alloy + Grafana
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: levelup_store_prometheus
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT}:9090'
    networks:
      - app-network

  loki:
    image: grafana/loki:latest
    container_name: levelup_store_loki
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/loki.yaml
    networks:
      - app-network

  alloy:
    image: grafana/alloy:latest
    container_name: levelup_store_alloy
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy
    networks:
      - app-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: levelup_store_grafana
    restart: unless-stopped
    user: '472'
    volumes:
      - ${PWD}/docker/config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${PWD}/docker/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PWD}/docker/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT}:3000'
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
