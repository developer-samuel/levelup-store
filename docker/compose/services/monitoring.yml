# ──────────────────────────────────────────────────────────────────────────────────────────────
# 📊 Monitoring - Prometheus + Grafana
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: levelup_store_prometheus
    restart: unless-stopped
    volumes:
      - ${PWD}/docker/config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT}:9090'
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: levelup_store_grafana
    restart: unless-stopped
    user: '472'
    volumes:
      - ${PWD}/docker/config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ${PWD}/docker/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PWD}/docker/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT}:3000'
    networks:
      - app-network
    depends_on:
      - prometheus
