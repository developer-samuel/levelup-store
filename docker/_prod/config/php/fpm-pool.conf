[www]
; TCP socket - nginx connects to PHP-FPM on localhost:9000 within the same container
listen = 127.0.0.1:9000

; No user/group - container runs as non-root UID 1000 in K8s
; user = www-data
; group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 1000
