server {
    listen 8000;
    server_name _;

    root /var/www/public;
    index index.php;

    # Security headers (Traefik adds these in production, nginx adds them for direct access / CI)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; frame-src https://js.stripe.com https://challenges.cloudflare.com; connect-src 'self' https://api.stripe.com; object-src 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 256;

    # FastCGI settings
    fastcgi_connect_timeout 20s;
    fastcgi_send_timeout    120s;
    fastcgi_read_timeout    300s;

    # Built frontend assets - long-lived cache (content-hashed filenames)
    location /build/ {
        alias /var/www/public/build/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PHP-FPM running on localhost:9000 in same container
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_intercept_errors off;
        fastcgi_ignore_client_abort off;
        include fastcgi_params;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
