---
# SSH
hardening_ssh_port: 22
hardening_ssh_max_auth_tries: 3
hardening_ssh_login_grace_time: 30

# fail2ban - SSH brute force
hardening_fail2ban_ssh_maxretry: 5
hardening_fail2ban_ssh_bantime: 3600    # 1 hour
hardening_fail2ban_ssh_findtime: 600    # 10 minute window

# unattended-upgrades
hardening_unattended_reboot: false      # do not reboot automatically - k3s would crash
