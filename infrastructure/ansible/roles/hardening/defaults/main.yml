---
# SSH
ssh_port: 22
ssh_max_auth_tries: 3
ssh_login_grace_time: 30

# fail2ban - SSH brute force
fail2ban_ssh_maxretry: 5
fail2ban_ssh_bantime: 3600    # 1 hour
fail2ban_ssh_findtime: 600    # 10 minute window

# unattended-upgrades
unattended_reboot: false      # do not reboot automatically - k3s would crash
