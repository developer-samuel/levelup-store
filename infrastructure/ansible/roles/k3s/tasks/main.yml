---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - iptables-persistent
    state: present

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure k3s TLS SAN with public IP
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      tls-san:
        - {{ ansible_host }}
    mode: "0644"

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Install k3s
  ansible.builtin.shell:
    cmd: /tmp/k3s-install.sh
    creates: "{{ k3s_install_dir }}/k3s"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "--default-local-storage-path={{ k3s_storage_path }}"

- name: Remove k3s install script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent

- name: Enable and start k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for k3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: result
  until: result.rc == 0
  retries: 10
  delay: 5
  changed_when: false

- name: Open port 80 (HTTP)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "80"
    jump: ACCEPT
    state: present

- name: Open port 443 (HTTPS)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "443"
    jump: ACCEPT
    state: present

- name: Open port 6443 (Kubernetes API)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "6443"
    jump: ACCEPT
    state: present

- name: Save iptables rules
  ansible.builtin.command: netfilter-persistent save
  changed_when: true

- name: Ensure local .kube directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    flat: true

- name: Update kubeconfig server URL to public IP
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
