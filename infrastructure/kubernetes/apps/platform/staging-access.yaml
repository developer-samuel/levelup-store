apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staging-basic-auth
  namespace: levelup-store-staging
spec:
  basicAuth:
    secret: staging-basic-auth-secret
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staging-access
  namespace: levelup-store-staging
spec:
  chain:
    middlewares:
      - name: staging-basic-auth
