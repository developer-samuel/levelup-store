apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: levelup-store-assistant-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: levelup-store-assistant-staging
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/developer-samuel/levelup-store
    targetRevision: staging
    path: infrastructure/helm/apps/assistant
    helm:
      valueFiles:
        - values.yaml
        - values.staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: levelup-store-assistant-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
