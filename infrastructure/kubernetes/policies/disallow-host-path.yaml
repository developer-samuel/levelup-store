apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow Host Path
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >
      Mounting host paths gives a container access to the host filesystem.
      This policy blocks hostPath volumes cluster-wide.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-host-path
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [levelup-store, levelup-store-assistant]
      validate:
        message: "hostPath volumes are not allowed."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[].hostPath | length(@) }}"
                operator: GreaterThan
                value: 0
