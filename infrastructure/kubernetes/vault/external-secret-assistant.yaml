apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: levelup-store-assistant-secret
  namespace: levelup-store-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: levelup-store-assistant-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/levelup-store/assistant
    - extract:
        key: secret/levelup-store/shared
