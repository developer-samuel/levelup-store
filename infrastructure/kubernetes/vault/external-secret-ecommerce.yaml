apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: levelup-store
  namespace: levelup-store
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: levelup-store
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/levelup-store/ecommerce
    - extract:
        key: secret/levelup-store/shared
