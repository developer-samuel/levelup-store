# k3s-specific override for the built-in Traefik Helm chart.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    image:
      repository: ghcr.io/developer-samuel/levelup-store-traefik
      tag: 351d5cc
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
    experimental:
      localPlugins:
        coraza-traefik:
          moduleName: github.com/jcchavezs/coraza-http-wasm-traefik
