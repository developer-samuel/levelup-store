keda:
  resources:
    operator:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    metricServer:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  operator:
    livenessProbe:
      timeoutSeconds: 10
      failureThreshold: 5
    readinessProbe:
      timeoutSeconds: 10
      failureThreshold: 5
