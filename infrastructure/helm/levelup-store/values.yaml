# Application
app:
  image:
    repository: ghcr.io/developer-samuel/levelup-store
    tag: latest
    pullPolicy: Always

  replicas: 1

  env: prod
  debug: "0"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Ingress
ingress:
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  # host: set via make secrets (APP_DOMAIN)
  tls:
    enabled: true
    secretName: levelup-store-tls

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true

# Elasticsearch
elasticsearch:
  enabled: true

# Redis
redis:
  enabled: true

# RabbitMQ
rabbitmq:
  enabled: true

# MinIO
minio:
  enabled: true

# Mercure
mercure:
  enabled: true

# Turnstile (CAPTCHA)
turnstile:
  enabled: true

# Network Policy
networkPolicy:
  enabled: true

# Sealed Secrets
sealedSecrets:
  enabled: true

# PostgreSQL Backup
pgBackup:
  enabled: true
  schedule: "0 2 * * *"
  bucket: pg-backups
  retentionDays: 30

# LimitRange
limitRange:
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 50m
    memory: 128Mi
  max:
    cpu: 500m
    memory: 512Mi
  min:
    cpu: 10m
    memory: 32Mi

# Resource Quota - namespace ceiling (node: 2 CPU / 12Gi RAM)
resourceQuota:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "3"
    memory: 6Gi
  pods: "20"
  pvcs: "10"

# KEDA - event-driven worker autoscaling
keda:
  enabled: true
  queueName: messages
  queueLength: "10"
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 30
