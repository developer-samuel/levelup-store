{{- if .Values.pgBackup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "levelup-store.fullname" . }}-pg-backup
  labels:
    {{- include "levelup-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-backup
spec:
  schedule: {{ .Values.pgBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # Step 1: pg_dump → /backup/dump.sql.gz
            - name: pg-dump
              image: postgres:{{ .Values.app.postgresVersion }}-alpine
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  FILENAME="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Dumping database to /backup/$FILENAME..."
                  PG_URL=$(echo "$DATABASE_URL" | sed 's|^pgsql://|postgresql://|;s|?.*||')
                  pg_dump "$PG_URL" | gzip > /backup/$FILENAME
                  echo "Dump complete: $(du -sh /backup/$FILENAME | cut -f1)"
              envFrom:
                - secretRef:
                    name: {{ include "levelup-store.fullname" . }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi

          containers:
            # Step 2: upload to MinIO using mc (MinIO client)
            - name: upload
              image: minio/mc:RELEASE.2025-08-13T08-35-41Z
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  FILE=$(ls /backup/*.sql.gz | head -1)
                  FILENAME=$(basename $FILE)
                  echo "Uploading $FILENAME to MinIO bucket {{ .Values.pgBackup.bucket }}..."
                  MC_CONFIG_DIR=/tmp/.mc mc alias set minio \
                    http://{{ .Release.Name }}-minio:9000 \
                    "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  MC_CONFIG_DIR=/tmp/.mc mc cp $FILE minio/{{ .Values.pgBackup.bucket }}/$FILENAME
                  echo "Upload complete: {{ .Values.pgBackup.bucket }}/$FILENAME"
                  # Delete backups older than {{ .Values.pgBackup.retentionDays }} days
                  CUTOFF=$(date -d "-{{ .Values.pgBackup.retentionDays }} days" +%Y%m%d 2>/dev/null || \
                            date -v-{{ .Values.pgBackup.retentionDays }}d +%Y%m%d)
                  MC_CONFIG_DIR=/tmp/.mc mc ls minio/{{ .Values.pgBackup.bucket }}/ \
                    | awk '{print $5}' \
                    | grep "^backup-" \
                    | while read f; do
                        FDATE=$(echo $f | grep -o '[0-9]\{8\}' | head -1)
                        if [ "$FDATE" -lt "$CUTOFF" ]; then
                          echo "Deleting old backup: $f"
                          MC_CONFIG_DIR=/tmp/.mc mc rm minio/{{ .Values.pgBackup.bucket }}/$f
                        fi
                      done
              envFrom:
                - secretRef:
                    name: {{ include "levelup-store.fullname" . }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

          volumes:
            - name: backup
              emptyDir: {}
{{- end }}
