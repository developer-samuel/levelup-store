apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "levelup-store.fullname" . }}-migrate
  labels:
    {{- include "levelup-store.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          command:
            - php
            - bin/console
            - doctrine:migrations:migrate
            - --no-interaction
          envFrom:
            - configMapRef:
                name: {{ include "levelup-store.fullname" . }}
            - secretRef:
                name: {{ include "levelup-store.fullname" . }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
