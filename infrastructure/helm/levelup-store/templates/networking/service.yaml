apiVersion: v1
kind: Service
metadata:
  name: {{ include "levelup-store.fullname" . }}
  labels:
    {{- include "levelup-store.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "levelup-store.selectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
