minio:
  # Service name must match MINIO_ENDPOINT in configmap
  fullnameOverride: levelup-store-minio

  image:
    repository: bitnamilegacy/minio
    tag: 2025.7.23-debian-12-r5
  auth:
    # existingSecret: created via make services-secrets
    existingSecret: levelup-store-minio-secret

  defaultBuckets: levelup-store,pg-backups

  console:
    image:
      repository: bitnamilegacy/minio-object-browser

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hostname: minio.levelup-store.samuel-steiner.com
    tls: true
    extraTls:
      - hosts:
          - minio.levelup-store.samuel-steiner.com
        secretName: levelup-store-minio-tls

  persistence:
    size: 10Gi

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
