elasticsearch:
  # Service name must match ELASTICSEARCH_HOST in configmap
  fullnameOverride: levelup-store-elasticsearch

  image:
    repository: bitnamilegacy/elasticsearch
    tag: 9.1.2-debian-12-r0

  # Single-node, security disabled (internal network)
  master:
    replicaCount: 1
    persistence:
      size: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    heapSize: 256m

  coordinating:
    replicaCount: 0

  data:
    replicaCount: 0

  ingest:
    replicaCount: 0

  security:
    enabled: false

  # Elasticsearch requires vm.max_map_count=262144 - needs privileged initContainer
  # Kyverno exception added in kyverno-policies
  sysctlImage:
    enabled: true
