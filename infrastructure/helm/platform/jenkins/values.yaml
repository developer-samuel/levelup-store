jenkins:
  controller:
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      # hostName: set via make jenkins-install (jenkins.$APP_DOMAIN)
      tls:
        - secretName: jenkins-tls
          hosts: []  # set via make jenkins-install

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    initContainerEnv:
      - name: JAVA_OPTS
        value: "-Xmx512m"

    # Install yq binary into Jenkins home for use in pipeline steps
    initScripts:
      install-yq: |
        import java.nio.file.*
        def yqPath = '/var/jenkins_home/bin/yq'
        def yqFile = new File(yqPath)
        if (!yqFile.exists()) {
          new File('/var/jenkins_home/bin').mkdirs()
          def url = 'https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_arm64'
          ['curl', '-sSL', '-o', yqPath, url].execute().waitFor()
          ['chmod', '+x', yqPath].execute().waitFor()
        }

    javaOpts: "-Xmx512m"

    numExecutors: 2

    additionalPlugins:
      - job-dsl
      - pipeline-utility-steps

    # Read secrets from jenkins-credentials k8s secret (created manually once on VPS)
    containerEnv:
      - name: GITHUB_PAT
        valueFrom:
          secretKeyRef:
            name: jenkins-credentials
            key: GITHUB_PAT

    JCasC:
      defaultConfig: true
      configScripts:
        credentials: |
          credentials:
            system:
              domainCredentials:
                - credentials:
                    - usernamePassword:
                        id: "github-pat"
                        username: "developer-samuel"
                        password: "${GITHUB_PAT}"
                        description: "GitHub PAT - push Helm tag commits"
                    - string:
                        id: "ghcr-token"
                        secret: "${GITHUB_PAT}"
                        description: "GHCR token - pull/push images"

        global-env: |
          jenkins:
            globalNodeProperties:
              - envVars:
                  env:
                    - key: GHCR_USER
                      value: "developer-samuel"
                    - key: PATH
                      value: "/var/jenkins_home/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

        jobs: |
          jobs:
            - script: |
                pipelineJob('levelup-store-deploy') {
                  description('Manual deploy / rollback - pass IMAGE_TAG for rollback, leave empty to build from HEAD')
                  parameters {
                    stringParam('IMAGE_TAG', '', 'Image SHA tag to deploy. Leave empty to build from HEAD.')
                    choiceParam('TARGET', ['all', 'ecommerce', 'assistant'], 'Which app to deploy.')
                    choiceParam('ENVIRONMENT', ['staging', 'production'], 'Target environment.')
                  }
                  definition {
                    cpsScm {
                      scm {
                        git {
                          remote {
                            url('https://github.com/developer-samuel/levelup-store.git')
                            credentials('github-pat')
                          }
                          branch('*/main')
                        }
                      }
                      scriptPath('Jenkinsfile')
                    }
                  }
                }

  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi

  serviceAccount:
    create: true
    name: jenkins
