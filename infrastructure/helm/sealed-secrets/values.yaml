sealed-secrets:
  # Fullname override so the controller is always named "sealed-secrets"
  # (kubeseal default expects this name)
  fullnameOverride: sealed-secrets

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Rotate the sealing key every 30 days (default)
  keyrenewperiod: "720h"

  # Retain old keys so old sealed secrets remain decryptable
  keyttl: "8760h"  # 1 year
