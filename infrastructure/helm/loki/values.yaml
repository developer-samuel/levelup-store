loki:
  # Single binary - suitable for single-node k3s
  deploymentMode: SingleBinary

  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    auth_enabled: true
    schemaConfig:
      configs:
        - from: "2026-09-10"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  # Disable components not needed in single binary mode
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

# Promtail - collects logs from all pods
promtail:
  enabled: true

  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
        tenantID: levelup-store

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
