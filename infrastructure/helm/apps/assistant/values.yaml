imagePullSecrets:
  - name: ghcr-secret

app:
  image:
    repository: ghcr.io/developer-samuel/levelup-store-assistant
    tag: latest@sha256:923835b7f9b9eeb0d2206d8c63004b8b364d9009e084af28773fbb50b2e2237d
    pullPolicy: Always

  replicas: 1

  # FastAPI + ChromaDB embedding calls
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  vpa:
    enabled: true
    updateMode: "Off"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

worker:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

scheduler:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  host: ""            # Required: set in values.prod.yaml
  tls: true
  className: traefik
  path: /
  clusterIssuer: letsencrypt-prod
  stagingMiddleware: false

chromadb:
  enabled: true
  host: chromadb
  port: 8000

  command:
    - chroma
    - run
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--path"
    - "/chroma/chroma"
  image:
    repository: chromadb/chroma
    tag: "1.5.9"
    pullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    storageClass: ""   # cluster default

  # Vector DB
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

otel:
  enabled: true

broker:
  # Enable for Ollama deployments: set broker.enabled=true and broker.rabbitmqUrl via ArgoCD to deploy the async worker.
  enabled: false

# Network Policy
networkPolicy:
  enabled: true

# LimitRange - namespace-level container defaults
limitRange:
  default:
    cpu: 500m
    memory: 1Gi
  defaultRequest:
    cpu: 25m
    memory: 128Mi
  max:
    cpu: "2"
    memory: 4Gi
  min:
    cpu: 10m
    memory: 32Mi

# Resource Quota - total namespace ceiling (~10GB target, 12GB node)
resourceQuota:
  requests:
    cpu: "250m"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 10Gi
  pods: "10"
  pvcs: "5"
