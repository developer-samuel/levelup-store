imagePullSecrets:
  - name: ghcr-secret

app:
  image:
    repository: ghcr.io/developer-samuel/levelup-store-assistant
    tag: latest@sha256:8b14240c85fc7d1eab11609db99fe25230c0d784f15339eb258465d3a77359dd
    pullPolicy: Always

  replicas: 1

  # FastAPI + ChromaDB embedding calls
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  vpa:
    enabled: true
    updateMode: "Off"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

worker:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

scheduler:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

ingress:
  enabled: true
  host: ""            # Required: set in values.prod.yaml
  tls: true
  className: traefik
  path: /
  clusterIssuer: letsencrypt-prod

chromadb:
  enabled: true
  host: chromadb
  port: 8000

  # Override default entrypoint to skip --log-config (file not writable in k8s)
  command:
    - uvicorn
    - chromadb.app:app
    - "--workers"
    - "1"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8000"
    - "--proxy-headers"
    - "--timeout-keep-alive"
    - "30"
  image:
    repository: chromadb/chroma
    tag: "0.6.3@sha256:e0e78dc7609a599b63c99753442c7d01b1d3d369ce0e3bf3e0540536fec4fa7a"
    pullPolicy: IfNotPresent
  persistence:
    size: 5Gi
    storageClass: ""   # cluster default

  # Vector DB
  resources:
    requests:
      cpu: 25m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

otel:
  enabled: false
  endpoint: ""
  protocol: "http/protobuf"

broker:
  enabled: true

# Network Policy
networkPolicy:
  enabled: true

# LimitRange - namespace-level container defaults
limitRange:
  default:
    cpu: 500m
    memory: 1Gi
  defaultRequest:
    cpu: 25m
    memory: 128Mi
  max:
    cpu: "2"
    memory: 4Gi
  min:
    cpu: 10m
    memory: 32Mi

# Resource Quota - total namespace ceiling (~10GB target, 12GB node)
resourceQuota:
  requests:
    cpu: "250m"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 10Gi
  pods: "10"
  pvcs: "5"
