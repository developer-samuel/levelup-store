apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "levelup-store-assistant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "levelup-store-assistant.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "levelup-store-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "levelup-store-assistant.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.app.securityContext | nindent 8 }}
      containers:
        - name: assistant
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.app.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.app.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: {{- toYaml .Values.app.securityContext.capabilities.drop | nindent 16 }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "levelup-store-assistant.fullname" . }}-config
            - secretRef:
                name: {{ include "levelup-store-assistant.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
