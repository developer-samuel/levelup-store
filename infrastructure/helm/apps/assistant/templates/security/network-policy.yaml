{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "levelup-store-assistant.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "levelup-store-assistant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "levelup-store-assistant.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from Traefik ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8001
          protocol: TCP
    # Allow intra-namespace traffic (worker, scheduler → app SSE/health)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}

  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Internal services - same namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 5432   # PostgreSQL
          protocol: TCP
        - port: 6379   # Redis
          protocol: TCP
        - port: 5672   # RabbitMQ AMQP
          protocol: TCP
        - port: 8000   # ChromaDB
          protocol: TCP
    {{- if .Values.otel.enabled }}
    # OTel collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 4318
          protocol: TCP
    {{- end }}

    # External HTTPS - OpenAI API
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
