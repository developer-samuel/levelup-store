apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "levelup-store-assistant.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "levelup-store-assistant.labels" . | nindent 4 }}
data:
  CHROMADB_HOST: {{ .Values.chromadb.host | quote }}
  CHROMADB_PORT: {{ .Values.chromadb.port | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: "levelup-store-assistant"
  {{- end }}
