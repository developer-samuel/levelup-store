apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "levelup-store-assistant.fullname" . }}-circuit-breaker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "levelup-store-assistant.labels" . | nindent 4 }}
spec:
  circuitBreaker:
    expression: ResponseCodeRatio(500, 600, 0, 600) > 0.3 || NetworkErrorRatio() > 0.3 || LatencyAtQuantileMS(50.0) > 10000
    checkPeriod: 10s
    fallbackDuration: 30s
    recoveryDuration: 15s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "levelup-store-assistant.fullname" . }}-security-headers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "levelup-store-assistant.labels" . | nindent 4 }}
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsSeconds: 31536000  # 1 year - HSTS: browser remembers HTTPS-only for this duration
    stsIncludeSubdomains: true
    stsPreload: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
      X-XSS-Protection: "0"
      X-DNS-Prefetch-Control: "off"
      X-Permitted-Cross-Domain-Policies: "none"
      Cross-Origin-Embedder-Policy: "credentialless"
      Cross-Origin-Opener-Policy: "same-origin"
      Cross-Origin-Resource-Policy: "same-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      Content-Security-Policy: >-
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self';
        connect-src 'self' https:;
        object-src 'none';
        base-uri 'self'
