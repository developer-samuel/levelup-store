imagePullSecrets:
  - name: ghcr-secret

# Application
app:
  image:
    repository: ghcr.io/developer-samuel/levelup-store-ecommerce
    tag: latest@sha256:090ab4e646a8cb259569bbc69b8df7aacee864c262b167f681cfe24a30718607
    pullPolicy: Always

  replicas: 1

  env: prod
  debug: "0"

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  vpa:
    enabled: true
    updateMode: "Off"

# Ingress
ingress:
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  # host: set via make secrets (APP_DOMAIN)
  tls:
    enabled: true
    secretName: levelup-store-tls

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true

# Elasticsearch
elasticsearch:
  enabled: true

# Redis
redis:
  enabled: true

# RabbitMQ
rabbitmq:
  enabled: true

# MinIO
minio:
  enabled: true
  bucket: levelup-store

# OpenTelemetry
otel:
  enabled: true

# Mercure
mercure:
  enabled: true

# Turnstile (CAPTCHA)
turnstile:
  enabled: true

# Network Policy
networkPolicy:
  enabled: true

# Sealed Secrets
sealedSecrets:
  enabled: true

# PostgreSQL Backup
pgBackup:
  enabled: true
  schedule: "0 2 * * *"
  bucket: pg-backups
  retentionDays: 30
  dumpMemoryLimit: 512Mi
  rcloneImage: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5

# LimitRange
limitRange:
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 50m
    memory: 128Mi
  max:
    cpu: "4"
    memory: 10Gi
  min:
    cpu: 10m
    memory: 32Mi

# Resource Quota - namespace ceiling
resourceQuota:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    cpu: "8"
    memory: 12Gi
  pods: "20"
  pvcs: "10"

# KEDA - event-driven worker autoscaling
keda:
  enabled: true
  queueName: messages
  queueLength: "10"
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 15
  cooldownPeriod: 30
