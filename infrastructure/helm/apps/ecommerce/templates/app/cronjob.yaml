apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "levelup-store.fullname" . }}-scheduler
  labels:
    {{- include "levelup-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.securityContext.runAsUser }}
            fsGroup: {{ .Values.securityContext.runAsUser }}
          containers:
            - name: scheduler
              image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
              imagePullPolicy: {{ .Values.app.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              command:
                - php
                - /var/www/bin/console
                - messenger:consume
                - scheduler_default
                - --time-limit=840
              envFrom:
                - configMapRef:
                    name: {{ include "levelup-store.fullname" . }}
                - secretRef:
                    name: {{ include "levelup-store.fullname" . }}
              volumeMounts:
                - name: var-cache
                  mountPath: /var/www/var/cache
                - name: var-log
                  mountPath: /var/www/var/log
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: var-cache
              emptyDir: {}
            - name: var-log
              emptyDir: {}
            - name: tmp
              emptyDir: {}
