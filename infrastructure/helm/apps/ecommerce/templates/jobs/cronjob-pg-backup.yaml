{{- if .Values.pgBackup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "levelup-store.fullname" . }}-pg-backup
  labels:
    {{- include "levelup-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-backup
spec:
  schedule: {{ .Values.pgBackup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            # Step 1: pg_dump → /backup/dump.sql.gz
            - name: pg-dump
              image: postgres:{{ .Values.app.postgresVersion }}-alpine
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  FILENAME="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Dumping database to /backup/$FILENAME..."
                  PG_URL=$(echo "$DATABASE_URL" | sed 's|^pgsql://|postgresql://|;s|?.*||')
                  pg_dump "$PG_URL" | gzip > /backup/$FILENAME
                  echo "Dump complete: $(du -sh /backup/$FILENAME | cut -f1)"
              envFrom:
                - secretRef:
                    name: {{ include "levelup-store.fullname" . }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: {{ .Values.pgBackup.dumpMemoryLimit }}

          containers:
            # Step 2: upload to MinIO using rclone
            - name: upload
              image: {{ .Values.pgBackup.rcloneImage }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  FILE=$(ls /backup/*.sql.gz | head -1)
                  FILENAME=$(basename $FILE)
                  echo "Uploading $FILENAME to MinIO bucket {{ .Values.pgBackup.bucket }}..."
                  export RCLONE_CONFIG_MINIO_TYPE=s3
                  export RCLONE_CONFIG_MINIO_PROVIDER=Minio
                  export RCLONE_CONFIG_MINIO_ENDPOINT=http://{{ .Release.Name }}-minio:9000
                  export RCLONE_CONFIG_MINIO_ACCESS_KEY_ID="$MINIO_ROOT_USER"
                  export RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY="$MINIO_ROOT_PASSWORD"
                  export RCLONE_CONFIG_MINIO_ENV_AUTH=false
                  rclone copy $FILE minio:{{ .Values.pgBackup.bucket }}/
                  echo "Upload complete: {{ .Values.pgBackup.bucket }}/$FILENAME"
                  # Delete backups older than {{ .Values.pgBackup.retentionDays }} days
                  CUTOFF=$(date -d "-{{ .Values.pgBackup.retentionDays }} days" +%Y%m%d 2>/dev/null || \
                            date -v-{{ .Values.pgBackup.retentionDays }}d +%Y%m%d)
                  rclone ls minio:{{ .Values.pgBackup.bucket }}/ \
                    | awk '{print $2}' \
                    | grep "^backup-" \
                    | while read f; do
                        FDATE=$(echo $f | grep -o '[0-9]\{8\}' | head -1)
                        if [ "$FDATE" -lt "$CUTOFF" ]; then
                          echo "Deleting old backup: $f"
                          rclone delete minio:{{ .Values.pgBackup.bucket }}/$f
                        fi
                      done
              envFrom:
                - secretRef:
                    name: {{ include "levelup-store.fullname" . }}
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

          volumes:
            - name: backup
              emptyDir: {}
{{- end }}
