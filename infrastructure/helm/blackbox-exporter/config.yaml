prometheus-blackbox-exporter:
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: [HTTP/1.1, HTTP/2.0]
          valid_status_codes: [200, 201, 301, 302]
          follow_redirects: true
          preferred_ip_protocol: ip4

      https_2xx:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: [HTTP/1.1, HTTP/2.0]
          valid_status_codes: [200, 201, 301, 302]
          follow_redirects: true
          tls_config:
            insecure_skip_verify: false
          preferred_ip_protocol: ip4
