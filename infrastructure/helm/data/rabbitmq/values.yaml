rabbitmq:
  # Service name must match RABBITMQ_HOST in configmap
  fullnameOverride: levelup-store-rabbitmq

  image:
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1@sha256:9e635efba43143807c003fd52cd741e88ae1b45e4f5739105c8bf8f6f94912fe

  auth:
    # username: set via make services-secrets (from RABBITMQ_USER)
    # existingPasswordSecret/existingErlangSecret: created via make services-secrets
    existingPasswordSecret: levelup-store-rabbitmq-secret
    existingErlangSecret: levelup-store-rabbitmq-secret

  persistence:
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  metrics:
    enabled: true
