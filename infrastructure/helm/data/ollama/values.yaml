image:
  repository: ollama/ollama
  tag: "0.5.13@sha256:a79fc15cecf33ed3b05c09a28415db7291c85c4c9d5945f4597317ca02456532"
  pullPolicy: IfNotPresent

# Models to pull on startup (init container)
models:
  - llama3.2:1b
  - nomic-embed-text

persistence:
  size: 10Gi
  storageClass: ""   # cluster default

resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 6Gi

service:
  port: 11434
