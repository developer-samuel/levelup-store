# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🧱 Base Stack (prod-ready)
#
# Run with:
#   make up
#   docker compose up
# ──────────────────────────────────────────────────────────────────────────────────────────────

include:
  # Infrastructure
  - docker/compose/services/postgres.yml
  - docker/compose/services/elasticsearch.yml
  - docker/compose/services/redis.yml
  - docker/compose/services/rabbitmq.yml

  # Observability
  - docker/compose/services/observability.yml

  # Application
  - docker/compose/services/app.yml
  - docker/compose/services/cron.yml
  - docker/compose/services/worker.yml
  - docker/compose/services/webserver.yml

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🕸️ Networks & Volumes
# ──────────────────────────────────────────────────────────────────────────────────────────────

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
