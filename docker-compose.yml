# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🧱 Build & Runtime Base Configuration
# ──────────────────────────────────────────────────────────────────────────────────────────────

x-app-base: &app-base
  build:
    context: ./docker
    dockerfile: Dockerfile
  working_dir: /var/www
  volumes:
    - .:/var/www:delegated
    - ./var:/var/www/var:cached
    - ./vendor:/var/www/vendor:cached
    - ./node_modules:/var/www/node_modules:cached
  networks:
    - app-network
  logging:
    driver: 'json-file'
    options:
      max-size: '10m'
      max-file: '3'

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🛢️ Database & Cache Environment Settings
# ──────────────────────────────────────────────────────────────────────────────────────────────

x-env-database: &env-database
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

x-env-elasticsearch: &env-elasticsearch
  ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED}
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}
  ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT}

x-env-redis: &env-redis
  REDIS_ENABLED: ${REDIS_ENABLED}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}

x-env-rabbitmq: &env-rabbitmq
  RABBITMQ_ENABLED: ${RABBITMQ_ENABLED}
  RABBITMQ_HOST: ${RABBITMQ_HOST}
  RABBITMQ_PORT: ${RABBITMQ_PORT}
  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASS: ${RABBITMQ_PASS}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST}

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🌍 Application-Wide Environment
# ──────────────────────────────────────────────────────────────────────────────────────────────

x-app-environment: &app-environment
  APP_ENV: local
  APP_URL: ${APP_URL:-http://localhost:8000}
  TZ: Europe/Bratislava
  <<:
    - *env-database
    - *env-elasticsearch
    - *env-redis
    - *env-rabbitmq

# ──────────────────────────────────────────────────────────────────────────────────────────────
# ⚙️ Health Check Configuration
# ──────────────────────────────────────────────────────────────────────────────────────────────

x-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 5s

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🔧 Service Blueprints
# ──────────────────────────────────────────────────────────────────────────────────────────────

# PostgreSQL 17 Blueprint
x-service-postgres: &service-postgres
  image: postgres:17
  container_name: levelup_store_postgres
  environment:
    POSTGRES_DB: ${DB_DATABASE}
    POSTGRES_USER: ${DB_USERNAME}
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  volumes:
    - pg_data:/var/lib/postgresql/data
  ports:
    - '${DB_PORT}:5432'
  restart: unless-stopped
  networks:
    - app-network
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres']
    <<: *app-healthcheck

# Elasticsearch Blueprint
x-service-elasticsearch: &service-elasticsearch
  image: elasticsearch:8.17.0
  container_name: levelup_store_elasticsearch
  restart: unless-stopped
  environment:
    discovery.type: single-node
    xpack.security.enabled: "false"
    ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    http.cors.enabled: "true"
    http.cors.allow-origin: "'*'"
    http.cors.allow-headers: "Authorization,X-Requested-With,Content-Type,Content-Length"
  ports:
    - '${ELASTICSEARCH_PORT}:9200'
  volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
  networks:
    - app-network
  healthcheck:
    test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
    <<: *app-healthcheck

# Redis Blueprint
x-service-redis: &service-redis
  image: redis:latest
  container_name: levelup_store_redis
  ports:
    - '${REDIS_PORT}:6379'
  volumes:
    - redis_data:/data
    - ./docker/redis/config/redis.conf:/usr/local/etc/redis/config/redis.conf
  restart: unless-stopped
  networks:
    - app-network
  command: ['redis-server', '/usr/local/etc/redis/config/redis.conf']
  healthcheck:
    test: ['CMD', 'redis-cli', 'ping']
    <<: *app-healthcheck

# RabbitMQ Blueprint
x-service-rabbitmq: &service-rabbitmq
  image: rabbitmq:3-management
  container_name: levelup_store_rabbitmq
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
  ports:
    - '${RABBITMQ_PORT}:5672'
    - '15672:15672'
  volumes:
    - rabbitmq_data:/var/lib/rabbitmq
  networks:
    - app-network
  healthcheck:
    test: ['CMD', 'rabbitmq-diagnostics', 'ping']
    <<: *app-healthcheck

# Prometheus Blueprint
x-service-prometheus: &service-prometheus
  image: prom/prometheus:latest
  container_name: levelup_store_prometheus
  restart: unless-stopped
  volumes:
    - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    - prometheus_data:/prometheus
  ports:
    - '${PROMETHEUS_PORT}:9090'
  networks:
    - app-network

# Grafana Blueprint
x-service-grafana: &service-grafana
  image: grafana/grafana:latest
  container_name: levelup_store_grafana
  restart: unless-stopped
  user: '472'
  volumes:
    - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./docker/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
  ports:
    - '${GRAFANA_PORT}:3000'
  networks:
    - app-network
  depends_on:
    - prometheus

# PHP App Blueprint
x-service-app: &service-app
  container_name: levelup_store_app
  command: []
  <<: *app-base
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    <<: *app-environment

# Setup Container Blueprint
x-service-app-setup: &service-app-setup
  container_name: levelup_store_app_setup
  profiles: ['setup']
  command: ['setup']
  <<: *app-base
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    <<: *app-environment

# Cron / Scheduler Blueprint
x-service-cron: &service-cron
  <<: *app-base
  container_name: levelup_store_cron
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    <<: *app-environment
  entrypoint: ["/usr/local/bin/scripts/entrypoints/app/cron/run-cron.sh"]

# Messenger Worker Blueprint
x-service-worker: &service-worker
  <<: *app-base
  container_name: levelup_store_worker
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment:
    <<: *app-environment
  entrypoint: ["/usr/local/bin/scripts/entrypoints/app/worker/run-worker.sh"]

# Nginx Blueprint
x-service-webserver: &service-webserver
  container_name: levelup_store_nginx
  volumes:
    - .:/var/www:delegated
    - ./docker/nginx/config:/etc/nginx/conf.d
  ports:
    - '8000:80'
  dns: 8.8.8.8
  build:
    context: ./docker/nginx
    dockerfile: Dockerfile.nginx
  depends_on:
    - app
  networks:
    - app-network

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🚀 Services
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL Service
  postgres:
    <<: *service-postgres

  # Elasticsearch Service
  elasticsearch:
    <<: *service-elasticsearch

  # Redis Service
  redis:
    <<: *service-redis

  # RabbitMQ Service
  rabbitmq:
    <<: *service-rabbitmq

  # Prometheus Service
  prometheus:
    <<: *service-prometheus

  # Grafana Service
  grafana:
    <<: *service-grafana

  # PHP App Service
  app:
    <<: *service-app

  # PHP Setup Service
  app_setup:
    <<: *service-app-setup

  # Cron / Scheduler Service
  cron:
    <<: *service-cron

  # Messenger Worker Service
  worker:
    <<: *service-worker

  # Nginx Service
  webserver:
    <<: *service-webserver

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🕸️ Networks & Volumes
# ──────────────────────────────────────────────────────────────────────────────────────────────

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
