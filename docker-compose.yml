# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🧱 Base Stack (prod-ready)
# ──────────────────────────────────────────────────────────────────────────────────────────────

include:
  # ── Shared ────────────────────────────────────────────────────────────────────

  # Cache
  - docker/compose/services/cache/redis.yml

  # Messaging
  - docker/compose/services/messaging/rabbitmq.yml

  # Observability
  - docker/compose/services/observability/prometheus.yml
  - docker/compose/services/observability/alerts.yml
  - docker/compose/services/observability/loki.yml
  - docker/compose/services/observability/alloy.yml
  - docker/compose/services/observability/grafana.yml

  # Server
  - docker/compose/services/server/nginx.yml

  # ── E-commerce ────────────────────────────────────────────────────────────────

  - apps/ecommerce/docker/compose/database/postgres.yml
  - apps/ecommerce/docker/compose/database/elasticsearch.yml
  - apps/ecommerce/docker/compose/storage/minio.yml
  - apps/ecommerce/docker/compose/realtime/mercure.yml
  - apps/ecommerce/docker/compose/app/app.yml
  - apps/ecommerce/docker/compose/app/cron.yml
  - apps/ecommerce/docker/compose/app/worker.yml

  # ── Assistant ─────────────────────────────────────────────────────────────────

  - apps/assistant/docker/compose/database/chromadb.yml
  - apps/assistant/docker/compose/app/app.yml
  - apps/assistant/docker/compose/app/cron.yml
  - apps/assistant/docker/compose/app/worker.yml

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🕸️ Networks & Volumes
# ──────────────────────────────────────────────────────────────────────────────────────────────

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local
  mercure_data:
    driver: local
  mercure_config:
    driver: local
  chroma_data:
    driver: local
