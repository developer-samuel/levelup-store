name: Prepare Environment
description: Copy env file and inject runtime secrets

inputs:
  source:
    description: Source env file to copy (.env.example or .env.test)
    required: false
    default: '.env.example'

runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        cp ${{ inputs.source }} .env
        echo "APP_SECRET=$(openssl rand -hex 32)" >> .env
        echo "HMAC_SECRET=$(openssl rand -hex 32)" >> .env
        echo "JWT_PASSPHRASE=$(openssl rand -hex 32)" >> .env
        sed -i '/^DATABASE_URL=/d' .env
        echo "DATABASE_URL=${DATABASE_URL}" >> .env
        sed -i '/^REDIS_URL=/d' .env
        echo "REDIS_URL=${REDIS_URL}" >> .env
        sed -i '/^MESSENGER_TRANSPORT_DSN=/d' .env
        echo "MESSENGER_TRANSPORT_DSN=${RABBITMQ_URL}" >> .env
