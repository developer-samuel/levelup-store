name: Setup MinIO
description: Start S3-compatible server (moto), create bucket, and inject environment variables

inputs:
  minio-port:
    description: Host port for MinIO API
    required: false
    default: '9000'
  minio-user:
    description: MinIO root user
    required: false
    default: 'minioadmin'
  minio-password:
    description: MinIO root password
    required: false
    default: 'minioadmin'
  minio-bucket:
    description: Bucket name to create
    required: false
    default: 'levelup-store'

runs:
  using: composite
  steps:
    - name: Inject MinIO environment
      shell: bash
      run: |
        echo "MINIO_ENABLED=true" >> $GITHUB_ENV
        echo "MINIO_ROOT_USER=${{ inputs.minio-user }}" >> $GITHUB_ENV
        echo "MINIO_ROOT_PASSWORD=${{ inputs.minio-password }}" >> $GITHUB_ENV
        echo "MINIO_ENDPOINT=http://127.0.0.1:${{ inputs.minio-port }}" >> $GITHUB_ENV
        echo "MINIO_PUBLIC_URL=http://127.0.0.1:${{ inputs.minio-port }}" >> $GITHUB_ENV
        echo "MINIO_BUCKET=${{ inputs.minio-bucket }}" >> $GITHUB_ENV

    - name: Start MinIO server
      shell: bash
      run: |
        python3 -m venv /tmp/moto-venv
        /tmp/moto-venv/bin/pip install --quiet 'moto[s3,server]'
        AWS_ACCESS_KEY_ID=${{ inputs.minio-user }} \
        AWS_SECRET_ACCESS_KEY=${{ inputs.minio-password }} \
        AWS_DEFAULT_REGION=us-east-1 \
        /tmp/moto-venv/bin/moto_server -p ${{ inputs.minio-port }} &>/tmp/minio.log &
        echo "moto_server started (PID $!)"

    - name: Wait for MinIO and create bucket
      shell: bash
      run: |
        echo "Waiting for MinIO to be ready..."
        RETRIES=30
        until curl -sf http://127.0.0.1:${{ inputs.minio-port }}/; do
          RETRIES=$((RETRIES - 1))
          if [ "$RETRIES" -le 0 ]; then
            echo "MinIO failed to start. Log:"
            cat /tmp/minio.log
            exit 1
          fi
          echo "MinIO not ready, retrying ($RETRIES left)..."
          sleep 2
        done
        echo "MinIO is ready."
        /tmp/moto-venv/bin/python3 -c "import boto3; s3=boto3.client('s3',endpoint_url='http://127.0.0.1:${{ inputs.minio-port }}',aws_access_key_id='${{ inputs.minio-user }}',aws_secret_access_key='${{ inputs.minio-password }}',region_name='us-east-1'); s3.create_bucket(Bucket='${{ inputs.minio-bucket }}'); print('Bucket ${{ inputs.minio-bucket }} ready.')"
