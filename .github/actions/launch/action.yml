name: Launch PHP Server
description: Warm up cache, start PHP built-in server and wait until ready

inputs:
  health-check-path:
    description: Path to use for health check
    default: /

runs:
  using: composite
  steps:
    - name: Cache warmup
      shell: bash
      run: php bin/console cache:warmup

    - name: Start PHP server
      shell: bash
      run: |
        PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8000 -t public &
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8000${{ inputs.health-check-path }} > /dev/null && echo "Server ready after ${i}s" && exit 0
          sleep 1
        done
        echo "Server failed to start within 30s" && exit 1
