name: Setup MinIO
description: Start MinIO server binary, create bucket, and inject environment variables

inputs:
  minio-port:
    description: Host port for MinIO API
    required: false
    default: '9000'
  minio-user:
    description: MinIO root user
    required: false
    default: 'minioadmin'
  minio-password:
    description: MinIO root password
    required: false
    default: 'minioadmin'
  minio-bucket:
    description: Bucket name to create
    required: false
    default: 'levelup-store'

runs:
  using: composite
  steps:
    - name: Inject MinIO environment
      shell: bash
      run: |
        echo "MINIO_ENABLED=true" >> $GITHUB_ENV
        echo "MINIO_ROOT_USER=${{ inputs.minio-user }}" >> $GITHUB_ENV
        echo "MINIO_ROOT_PASSWORD=${{ inputs.minio-password }}" >> $GITHUB_ENV
        echo "MINIO_ENDPOINT=http://127.0.0.1:${{ inputs.minio-port }}" >> $GITHUB_ENV
        echo "MINIO_PUBLIC_URL=http://127.0.0.1:${{ inputs.minio-port }}" >> $GITHUB_ENV
        echo "MINIO_BUCKET=${{ inputs.minio-bucket }}" >> $GITHUB_ENV

    - name: Start MinIO server
      shell: bash
      run: |
        curl -sSL \
          "https://dl.min.io/aistor/minio/release/linux-amd64/minio" \
          -o /usr/local/bin/minio
        chmod +x /usr/local/bin/minio
        file /usr/local/bin/minio
        mkdir -p /tmp/minio-data
        MINIO_ROOT_USER=${{ inputs.minio-user }} \
        MINIO_ROOT_PASSWORD=${{ inputs.minio-password }} \
        /usr/local/bin/minio server /tmp/minio-data \
          --address ":${{ inputs.minio-port }}" \
          --quiet &>/tmp/minio.log &
        echo "MinIO started (PID $!)"

    - name: Wait for MinIO and create bucket
      shell: bash
      run: |
        echo "Waiting for MinIO to be ready..."
        RETRIES=30
        until curl -sf http://127.0.0.1:${{ inputs.minio-port }}/minio/health/live; do
          RETRIES=$((RETRIES - 1))
          if [ "$RETRIES" -le 0 ]; then
            echo "MinIO failed to start. Log:"
            cat /tmp/minio.log
            exit 1
          fi
          echo "MinIO not ready, retrying ($RETRIES left)..."
          sleep 2
        done
        echo "MinIO is ready."
        curl -sSL https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z -o /usr/local/bin/mc
        chmod +x /usr/local/bin/mc
        mc alias set ci http://127.0.0.1:${{ inputs.minio-port }} ${{ inputs.minio-user }} ${{ inputs.minio-password }}
        mc mb ci/${{ inputs.minio-bucket }} --ignore-existing
        mc anonymous set download ci/${{ inputs.minio-bucket }}
        echo "Bucket '${{ inputs.minio-bucket }}' ready."
