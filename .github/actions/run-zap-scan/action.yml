name: Run ZAP Scan
description: Run an OWASP ZAP baseline scan and upload the HTML report as an artifact

inputs:
  target:
    description: Target URL to scan
    required: true
  rules-file:
    description: Path to the ZAP rules TSV file
    required: true
  artifact-name:
    description: Name for the uploaded report artifact
    required: false
    default: zap-report

runs:
  using: composite
  steps:
    - name: Run ZAP baseline scan
      uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
      with:
        target: ${{ inputs.target }}
        cmd_options: '-a -I'
        rules_file_name: ${{ inputs.rules-file }}
        fail_action: true

    - name: Upload ZAP report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: report_html.html
