name: 🚀 Feature Request
description: Suggest a new feature or improvement
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? Describe it below.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: A clear description of what you want to happen...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Any alternative solutions or workarounds you've considered...
    validations:
      required: false
