name: 🚀 Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  ECOMMERCE_IMAGE: ${{ github.repository }}-ecommerce
  ASSISTANT_IMAGE: ${{ github.repository }}-assistant

jobs:
  # ─── Detect changes ───────────────────────────────────────────────────────
  changes:
    name: 🔍 Detect changes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      ecommerce: ${{ steps.filter.outputs.ecommerce }}
      assistant: ${{ steps.filter.outputs.assistant }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ecommerce:
              - 'apps/ecommerce/**'
              - '!apps/ecommerce/docs/**'
              - '!apps/ecommerce/scripts/**'
              - '!apps/ecommerce/tests/**'
              - '!**/*.md'
              - '!**/*.mmd'
              - 'docker/Dockerfile.prod'
            assistant:
              - 'apps/assistant/**'
              - '!apps/assistant/docs/**'
              - '!**/*.md'
              - '!**/*.mmd'
              - 'docker/Dockerfile.prod'

  # ─── Ecommerce: Build, SBOM, Scan, Sign ──────────────────────────────────
  build-ecommerce:
    needs: changes
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}-ecommerce
      context: .
      file: docker/Dockerfile.prod
      target: ecommerce
      changed: ${{ needs.changes.outputs.ecommerce }}
      app-name: ecommerce
      build-args: VITE_API_URL=https://assistant.${{ vars.APP_DOMAIN }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write

  # ─── Assistant: Build, SBOM, Scan, Sign ───────────────────────────────────
  build-assistant:
    needs: changes
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ github.repository }}-assistant
      context: .
      file: docker/Dockerfile.prod
      target: assistant
      changed: ${{ needs.changes.outputs.assistant }}
      app-name: assistant
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write

  # ─── Sync image tags → ArgoCD auto-syncs ─────────────────────────────────
  sync:
    name: 🔄 Sync image tags
    runs-on: ubuntu-latest
    needs: [build-ecommerce, build-assistant]
    if: always() && (needs.build-ecommerce.result == 'success' || needs.build-assistant.result == 'success')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update ecommerce image tag
        if: needs.build-ecommerce.result == 'success'
        run: |
          yq e '.app.image.tag = "${{ needs.build-ecommerce.outputs.image-tag }}"' \
            -i infrastructure/helm/apps/ecommerce/values.prod.yaml

      - name: Update assistant image tag
        if: needs.build-assistant.result == 'success'
        run: |
          yq e '.app.image.tag = "${{ needs.build-assistant.outputs.image-tag }}"' \
            -i infrastructure/helm/apps/assistant/values.prod.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/apps/ecommerce/values.prod.yaml \
                  infrastructure/helm/apps/assistant/values.prod.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: deploy ${{ needs.build-ecommerce.outputs.image-tag || needs.build-assistant.outputs.image-tag }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 5
          done
