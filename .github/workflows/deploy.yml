name: 🚀 Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Build & Push Docker Image ────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU (ARM64 emulation for cross-platform build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ─── SBOM ─────────────────────────────────────────────────────────────────
  sbom:
    name: 📋 SBOM
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      packages: read
      id-token: write   # Potrebné pre GitHub attestation

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM from image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ needs.build.outputs.image-tag }}

      - name: Attest SBOM (GitHub native supply chain)
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ─── Security Scan ────────────────────────────────────────────────────────
  scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

  # ─── Sign Image (keyless - Sigstore OIDC) ─────────────────────────────────
  #
  # Podpisuje image pomocou GitHub OIDC identity - žiadne kľúče na správu.
  # Podpis je uložený v Sigstore transparency log (Rekor) - verejne overiteľný.
  #
  # Overenie kýmkoľvek:
  #   cosign verify ghcr.io/developer-samuel/levelup-store@<digest> \
  #     --certificate-identity-regexp="https://github.com/developer-samuel/levelup-store" \
  #     --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
  # ──────────────────────────────────────────────────────────────────────────
  sign:
    name: ✍️ Sign Image
    runs-on: ubuntu-latest
    needs: [build, scan]    # Podpíš len ak scan prešiel

    permissions:
      contents: read
      packages: write
      id-token: write       # Potrebné pre keyless Sigstore OIDC signing

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

  # ─── Update image tag → ArgoCD auto-syncs ─────────────────────────────────
  sync:
    name: 🔄 Sync image tag
    runs-on: ubuntu-latest
    needs: [build, scan, sign]    # Blokovaný ak scan alebo sign zlyhá

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update image tag in values.prod.yaml
        run: |
          yq e '.app.image.tag = "${{ needs.build.outputs.image-tag }}"' \
            -i infrastructure/helm/levelup-store/values.prod.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/helm/levelup-store/values.prod.yaml
          git commit -m "chore: deploy ${{ needs.build.outputs.image-tag }} [skip ci]"
          git push
