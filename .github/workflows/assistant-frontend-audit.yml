name: 🎨 Assistant Frontend Audit

on:
  push:
    branches: [main]
    paths: &frontend-paths
      - 'apps/assistant/client/**'
  pull_request:
    branches: [main]
    paths: *frontend-paths
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  # ─── Accessibility ────────────────────────────────────────────────────────
  accessibility:
    name: ♿ Accessibility (axe-core + pa11y)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build assistant client
        run: pnpm --filter assistant build

      - name: Serve built assets
        run: |
          pnpm add -g serve
          serve -s dist/assistant -l 5174 &
          sleep 2

      - name: Run axe-core
        run: |
          pnpm add -g @axe-core/cli
          axe http://127.0.0.1:5174 \
            --tags wcag2a,wcag2aa \
            --reporter cli \
            --exit || true

      - name: Run pa11y
        run: |
          pnpm add -g pa11y
          pa11y http://127.0.0.1:5174 \
            --standard WCAG2AA \
            --reporter cli || true

  # ─── Lighthouse ───────────────────────────────────────────────────────────
  lighthouse:
    name: 🏠 Lighthouse audit
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build assistant client
        run: pnpm --filter assistant build

      - name: Serve built assets
        run: |
          pnpm add -g serve
          serve -s dist/assistant -l 5174 &
          sleep 2

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            http://127.0.0.1:5174/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
