---

name: 🐳 Assistant Docker Validate

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'docker/**'
      - 'apps/assistant/docker/**'
      - '.hadolint.yaml'
  workflow_dispatch:

permissions: read-all

jobs:
  # ─── Dockerfile Lint ──────────────────────────────────────────────────────
  dockerfile-lint:
    name: 🐳 Lint Dockerfile
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infrastructure/docker/Dockerfile.prod
          config: .hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          no-fail: false

      - uses: ./.github/actions/upload-sarif
        with:
          sarif-file: hadolint.sarif
          category: hadolint-assistant

  # ─── Trivy Image Scan ─────────────────────────────────────────────────────
  trivy-image:
    name: 🔒 Trivy image scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: infrastructure/docker/Dockerfile.prod
          target: assistant
          load: true
          tags: levelup-store-assistant:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: ./.github/actions/scan-trivy-image
        with:
          image-ref: levelup-store-assistant:pr
          category: trivy-image-assistant
