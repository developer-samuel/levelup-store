name: 🐳 Assistant Docker Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'apps/assistant/docker/**'
      - '.hadolint.yaml'
  workflow_dispatch:

jobs:
  # ─── Dockerfile Lint ──────────────────────────────────────────────────────
  dockerfile-lint:
    name: 🐳 Lint Dockerfile
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: docker/Dockerfile.prod
          config: .hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          no-fail: false

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint-assistant

  # ─── Trivy Image Scan ─────────────────────────────────────────────────────
  trivy-image:
    name: 🔒 Trivy image scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prod
          target: assistant
          load: true
          tags: levelup-store-assistant:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: levelup-store-assistant:pr
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-assistant
