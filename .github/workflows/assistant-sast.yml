name: 🔬 Assistant SAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/assistant/app/**'
      - 'apps/assistant/jobs/**'
      - 'apps/assistant/client/src/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/assistant/app/**'
      - 'apps/assistant/jobs/**'
      - 'apps/assistant/client/src/**'
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  # ─── Semgrep Python ───────────────────────────────────────────────────────
  semgrep-python:
    name: 🔬 Semgrep (Python)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/python \
            --config p/secrets \
            --include 'apps/assistant/**' \
            --sarif \
            --output semgrep-python.sarif \
            --error

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep-python.sarif
          category: semgrep-python
