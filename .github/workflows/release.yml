name: 📦 Release

on:
  release:
    types: [created]

jobs:
  release:
    name: 📦 Update CHANGELOG
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepend release notes to CHANGELOG.md
        env:
          BODY: ${{ github.event.release.body }}
        run: |
          ENTRY="${BODY}"
          if [ -f CHANGELOG.md ]; then
            printf '%s\n\n%s' "$ENTRY" "$(cat CHANGELOG.md)" > CHANGELOG.md
          else
            printf '%s' "$ENTRY" > CHANGELOG.md
          fi

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ github.event.release.tag_name }} [skip ci]" || echo "No changes to commit"
          git push origin main
