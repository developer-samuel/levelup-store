---

name: 🎭 Ecommerce Playwright E2E

on:
  schedule:
    - cron: '0 2 * * *'   # Nightly at 02:00 UTC
  workflow_dispatch:

env:
  PHP_VERSION: ${{ vars.PHP_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

permissions: read-all

jobs:
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.19.22@sha256:909a569c9c973d1de81cee7a002b69e65726f8d6317de4627ccfeb690a6d0ccb
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s

      redis:
        image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:316ffd2a847e59112eee2c65f04bbd0989d93aaf1486c07b721f8d22d863b968
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store
          db-port: '5432'
          db-password: secret

      - uses: ./.github/actions/elasticsearch
        with:
          elasticsearch-port: '9200'

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/rabbitmq
        with:
          rabbitmq-port: '5672'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-flags: '--ignore-scripts'

      - name: Rebuild native modules
        run: pnpm rebuild esbuild @parcel/watcher

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: pnpm --filter ecommerce exec playwright install --with-deps

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          with-reindex: 'true'

      - name: Build Frontend
        run: pnpm build

      - name: Link dist to public
        run: ln -s $(pwd)/dist apps/ecommerce/public/dist

      - name: Launch PHP server
        uses: ./.github/actions/launch
        with:
          health-check-path: /api/health
          port: '8008'

      - name: Run Playwright (all tests)
        run: pnpm --filter ecommerce e2e

      - name: Show PHP log on failure
        if: failure()
        run: cat apps/ecommerce/var/log/test.log 2>/dev/null || echo "No test.log found"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/ecommerce/var/tools/playwright
