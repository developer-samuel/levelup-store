name: 🐳 Ecommerce Docker Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'apps/ecommerce/docker/**'
      - 'docker-compose*.yml'
      - '.env.example'
      - '.hadolint.yaml'
  workflow_dispatch:

jobs:
  # ─── Dockerfile Lint ──────────────────────────────────────────────────────
  dockerfile-lint:
    name: 🐳 Lint Dockerfile
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile.prod
          config: .hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          no-fail: false

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint-ecommerce

  # ─── Docker Compose Validate ──────────────────────────────────────────────
  compose-validate:
    name: 🐙 Validate Compose files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          cp apps/ecommerce/.env.example apps/ecommerce/.env
          cp apps/assistant/.env.example apps/assistant/.env

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

  # ─── Container Structure Test ─────────────────────────────────────────────
  structure-test:
    name: 🐳 Container structure test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.prod
          target: ecommerce
          load: true
          tags: levelup-store-ecommerce:test
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Install container-structure-test
        run: |
          curl -sLO https://github.com/GoogleContainerTools/container-structure-test/releases/latest/download/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: |
          container-structure-test test \
            --image levelup-store-ecommerce:test \
            --config apps/ecommerce/docker/container-structure-test.yml

  # ─── Trivy Image Scan ─────────────────────────────────────────────────────
  trivy-image:
    name: 🔒 Trivy image scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.prod
          target: ecommerce
          load: true
          tags: levelup-store-ecommerce:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: levelup-store-ecommerce:pr
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-ecommerce
