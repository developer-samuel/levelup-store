name: 🔬 Ecommerce SAST

on:
  push:
    branches: [main]
    paths: &ecommerce-src-paths
      - 'apps/ecommerce/src/**'
      - 'apps/ecommerce/database/**'
      - 'apps/ecommerce/packages/**'
      - 'apps/ecommerce/config/**'
      - 'apps/ecommerce/bin/**'
      - 'apps/ecommerce/templates/**'
      - 'apps/ecommerce/assets/**'
      - 'apps/ecommerce/public/**'
      - 'apps/ecommerce/scripts/**'
      - 'apps/ecommerce/init.php'
  pull_request:
    branches: [main]
    paths: *ecommerce-src-paths
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

jobs:
  # ─── CodeQL ───────────────────────────────────────────────────────────────
  codeql:
    name: 🔬 CodeQL (TypeScript)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: codeql

  # ─── Semgrep ──────────────────────────────────────────────────────────────
  semgrep:
    name: 🔬 Semgrep (PHP + Symfony)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep
        run: |
          semgrep \
            --config p/php \
            --config p/secrets \
            --include 'apps/ecommerce/**' \
            --sarif \
            --output semgrep.sarif \
            --error

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
