---

name: 🤖 Assistant CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'apps/assistant/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'apps/assistant/**'
  workflow_dispatch:

concurrency:
  group: assistant-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: ${{ vars.NODE_VERSION }}

permissions: read-all

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Ruff Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff lint
        run: uv run ruff check app/ jobs/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ jobs/ tests/

  # ─── Type Check ──────────────────────────────────────────────────────────────
  type-check:
    name: 🔬 Mypy Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Mypy
        run: uv run mypy --explicit-package-bases app/ jobs/ tests/

  # ─── Dead Code ───────────────────────────────────────────────────────────────
  dead-code:
    name: 🪦 Vulture Dead Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Vulture
        run: uv run vulture app/ jobs/

  # ─── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assistant

    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/setup-postgres
        with:
          db-name: levelup_store_test
          db-port: '5432'
          db-password: secret

      - name: Pytest
        run: uv run pytest tests/ --cov=app --cov=jobs --cov-report=term-missing
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          ECOMMERCE_URL: http://localhost
          CORS_ORIGINS: http://localhost
          SUPPORT_EMAIL: test@example.com
          REDIS_URL: redis://localhost:6379

  # ─── Frontend Lint ───────────────────────────────────────────────────────────
  lint-frontend:
    name: 🧹 TS / ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: TypeScript type check
        run: pnpm type-check:all

      - name: ESLint
        run: pnpm lint:all

  # ─── Docker Build ─────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build assistant image
        run: docker build -t levelup-store-assistant:ci -f apps/assistant/docker/Dockerfile apps/assistant/
