name: 🐳 Build Image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without registry prefix (e.g. user/repo-ecommerce)
        required: true
        type: string
      context:
        description: Docker build context path
        required: true
        type: string
      file:
        description: Path to Dockerfile
        required: true
        type: string
      changed:
        description: Whether source files changed ('true'/'false')
        required: true
        type: string
      app-name:
        description: App name used for artifact/category labels (e.g. ecommerce)
        required: true
        type: string
      target:
        description: Docker build target stage (e.g. ecommerce, assistant)
        required: false
        type: string
        default: ''
    outputs:
      image-tag:
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    if: inputs.changed == 'true' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU (ARM64 emulation for cross-platform build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ inputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

  sbom:
    name: 📋 SBOM
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM from image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ needs.build.outputs.image-tag }}
          syft-version: v1.52.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ inputs.app-name }}-${{ needs.build.outputs.image-tag }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: sbom.spdx.json
          push-to-registry: true

  scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ needs.build.outputs.image-tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.app-name }}

  sign:
    name: ✍️ Sign Image
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: needs.build.result == 'success'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ inputs.image }}@${{ needs.build.outputs.image-digest }}
