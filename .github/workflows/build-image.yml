name: 🐳 Build Image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without registry prefix (e.g. user/repo-ecommerce)
        required: true
        type: string
      context:
        description: Docker build context path
        required: true
        type: string
      file:
        description: Path to Dockerfile
        required: true
        type: string
      changed:
        description: Whether source files changed ('true'/'false')
        required: true
        type: string
      app-name:
        description: App name used for artifact/category labels (e.g. ecommerce)
        required: true
        type: string
      target:
        description: Docker build target stage (e.g. ecommerce, assistant)
        required: false
        type: string
        default: ''
    outputs:
      image-tag:
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    if: inputs.changed == 'true' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.sha.outputs.short }}
      image-digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v7

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU (ARM64 emulation for cross-platform build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  sbom:
    name: 📋 SBOM
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM from image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ needs.build.outputs.image-tag }}
          syft-version: v1.52.0
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-${{ inputs.app-name }}-${{ needs.build.outputs.image-tag }}

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ needs.build.outputs.image-tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.app-name }}

  sign:
    name: ✍️ Sign Image
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: needs.build.result == 'success'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ inputs.image }}@${{ needs.build.outputs.image-digest }}
