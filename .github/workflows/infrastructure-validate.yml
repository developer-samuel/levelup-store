name: 🏗️ Infrastructure Validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - 'infrastructure/kubernetes/**'
      - 'infrastructure/helm/**'
      - 'docker/**'
      - 'apps/ecommerce/docker/**'
      - 'apps/assistant/docker/**'
  workflow_dispatch:

jobs:
  # ─── Terraform ────────────────────────────────────────────────────────────
  terraform:
    name: 🏗️ Terraform fmt & validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: infrastructure/terraform/oracle

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform fmt
        run: terraform fmt --check --recursive

      - name: terraform validate
        run: terraform validate

  # ─── YAML Lint ────────────────────────────────────────────────────────────
  yaml-lint:
    name: 📄 YAML Lint (Helm values)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint all Helm values files
        run: |
          find infrastructure/helm -name 'values*.yaml' | xargs yamllint \
            --config-data '{extends: relaxed, rules: {line-length: {max: 200}}}'

  # ─── Helm Lint ────────────────────────────────────────────────────────────
  helm-lint:
    name: ⎈ Helm Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: helm lint ecommerce (default values)
        run: |
          helm lint infrastructure/helm/apps/ecommerce \
            --values infrastructure/helm/apps/ecommerce/values.yaml

      - name: helm lint ecommerce (prod values)
        run: |
          helm lint infrastructure/helm/apps/ecommerce \
            --values infrastructure/helm/apps/ecommerce/values.yaml \
            --values infrastructure/helm/apps/ecommerce/values.prod.yaml

      - name: helm lint assistant (default values)
        run: |
          helm lint infrastructure/helm/apps/assistant \
            --values infrastructure/helm/apps/assistant/values.yaml \
            --set app.aiAssistantApiKey=dummy \
            --set broker.rabbitmqUrl=amqp://dummy \
            --set app.redisUrl=redis://dummy

      - name: helm lint assistant (prod values)
        run: |
          helm lint infrastructure/helm/apps/assistant \
            --values infrastructure/helm/apps/assistant/values.yaml \
            --values infrastructure/helm/apps/assistant/values.prod.yaml \
            --set app.aiAssistantApiKey=dummy \
            --set broker.rabbitmqUrl=amqp://dummy \
            --set app.redisUrl=redis://dummy

      - name: helm template (render & validate structure)
        run: |
          for chart in ecommerce assistant; do
            echo "── Validating $chart ──"
            args="infrastructure/helm/apps/$chart --values infrastructure/helm/apps/$chart/values.yaml"
            if [ "$chart" = "assistant" ]; then
              args="$args --set app.aiAssistantApiKey=dummy --set broker.aiAssistantApiKey=amqp://dummy --set app.redisUrl=redis://dummy"
            fi
            helm template levelup-store $args \
              | grep -v "^#" \
              | python3 -c "
          import sys, yaml
          docs = list(yaml.safe_load_all(sys.stdin))
          for doc in docs:
              if doc is None:
                  continue
              if 'apiVersion' not in doc:
                  print(f'ERROR: missing apiVersion in {doc.get(\"kind\", \"unknown\")}')
                  sys.exit(1)
          print(f'OK: {len([d for d in docs if d])} manifests validated')
          "
          done

  # ─── Kubeconform ──────────────────────────────────────────────────────────
  kubeconform:
    name: ☸️ Kubeconform
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            --strict \
            --ignore-missing-schemas \
            --kubernetes-version 1.32.0 \
            --summary \
            $(find infrastructure/kubernetes -name "*.yaml" -o -name "*.yml")

      - name: Render & validate ecommerce Helm chart
        run: |
          helm template levelup-store infrastructure/helm/apps/ecommerce \
            --values infrastructure/helm/apps/ecommerce/values.yaml \
          | kubeconform \
            --strict \
            --ignore-missing-schemas \
            --kubernetes-version 1.32.0 \
            --summary -

      - name: Render & validate assistant Helm chart
        run: |
          helm template levelup-store-assistant infrastructure/helm/apps/assistant \
            --values infrastructure/helm/apps/assistant/values.yaml \
            --set app.aiAssistantApiKey=dummy \
            --set broker.rabbitmqUrl=amqp://dummy \
            --set app.redisUrl=redis://dummy \
          | kubeconform \
            --strict \
            --ignore-missing-schemas \
            --kubernetes-version 1.32.0 \
            --summary -

  # ─── Checkov ──────────────────────────────────────────────────────────────
  checkov:
    name: 🔐 Checkov security scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,helm,dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov
