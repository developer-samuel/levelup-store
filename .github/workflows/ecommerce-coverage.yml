name: 📊 Ecommerce Coverage

on:
  push:
    branches: [main]
    paths:
      - 'apps/ecommerce/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ecommerce/**'
  workflow_dispatch:

env:
  PHP_VERSION: ${{ vars.PHP_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  # ─── Coverage ─────────────────────────────────────────────────────────────
  coverage:
    name: 📊 Upload coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/ecommerce

    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:316ffd2a847e59112eee2c65f04bbd0989d93aaf1486c07b721f8d22d863b968
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s

      elasticsearch:
        image: elasticsearch:8.19.22@sha256:909a569c9c973d1de81cee7a002b69e65726f8d6317de4627ccfeb690a6d0ccb
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s

      mercure:
        image: dunglas/mercure:v0.24.2@sha256:916834e499613d475e9ad5118cd2349875338f52d99d65b58aeff82f97ccb0c6
        env:
          SERVER_NAME: ':80'
          MERCURE_PUBLISHER_JWT_KEY: 'test-mercure-jwt-secret-256bit-ok'
          MERCURE_SUBSCRIBER_JWT_KEY: 'test-mercure-jwt-secret-256bit-ok'
          MERCURE_EXTRA_DIRECTIVES: "cors_origins *\nanonymous\n"
        ports:
          - 9300:80
        options: >-
          --health-cmd "nc -z localhost 80 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store_test
          db-port: '5432'
          db-password: secret

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/rabbitmq
        with:
          rabbitmq-port: '5672'

      - uses: ./.github/actions/minio
        with:
          minio-port: '9000'

      - uses: ./.github/actions/elasticsearch
        with:
          elasticsearch-port: '9200'

      - uses: ./.github/actions/mercure
        with:
          mercure-port: '9300'
          mercure-jwt-secret: 'test-mercure-jwt-secret-256bit-ok'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis, pcov
          coverage: pcov

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          symfony-env: test
          with-fixtures: 'false'
          with-reindex: 'true'

      - name: Run PHPUnit with coverage
        run: composer php-unit

      - name: Upload PHP coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/ecommerce/var/tools/php-unit/coverage.xml
          flags: phpunit
          fail_ci_if_error: false

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Vitest with coverage
        run: pnpm --filter ecommerce vitest

      - name: Generate ESLint report for SonarCloud
        run: pnpm --filter ecommerce lint:report

      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: vitest
          fail_ci_if_error: false

      - name: Upload coverage reports as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            apps/ecommerce/var/tools/php-unit/coverage.xml
            apps/ecommerce/var/tools/vitest/coverage/lcov.info
            apps/ecommerce/var/tools/eslint/report.json
          retention-days: 1

  # ─── SonarCloud ───────────────────────────────────────────────────────────
  sonarcloud:
    name: 🔍 SonarCloud analysis
    runs-on: ubuntu-latest
    needs: coverage

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # Full history required for blame information

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
