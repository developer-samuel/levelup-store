name: 🕷️ Ecommerce OWASP ZAP DAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/ecommerce/src/**'
      - 'apps/ecommerce/database/**'
      - 'apps/ecommerce/packages/**'
      - 'apps/ecommerce/config/**'
      - 'apps/ecommerce/bin/**'
      - 'apps/ecommerce/templates/**'
      - 'apps/ecommerce/assets/**'
      - 'apps/ecommerce/public/**'
      - 'apps/ecommerce/scripts/**'
      - 'apps/ecommerce/init.php'
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

env:
  PHP_VERSION: ${{ vars.PHP_VERSION }}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap:
    name: 🕷️ DAST scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.10.2@sha256:6f81e8915c60b065a524e6967e0ad1c639ba6efa84d669f823683ea04d9150ee
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store
          db-port: '5432'
          db-password: secret

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis

      - name: Bootstrap
        uses: ./.github/actions/bootstrap

      - name: Launch PHP server
        uses: ./.github/actions/launch

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:8000'
          rules_file_name: '.zap-rules.tsv'
          cmd_options: '-a'
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-report
          path: report_html.html
