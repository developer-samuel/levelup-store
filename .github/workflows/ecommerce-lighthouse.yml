---

name: 🔦 Ecommerce Lighthouse

on:
  push:
    branches: [main]
    paths:
      - 'apps/ecommerce/assets/**'
      - 'apps/ecommerce/templates/**'
      - 'apps/ecommerce/public/**'
      - 'apps/ecommerce/src/Presentation/**'
      - 'apps/ecommerce/vite.config.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://${{ vars.APP_DOMAIN }}/
            https://${{ vars.APP_DOMAIN }}/products
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          budgetPath: apps/ecommerce/.lighthouse-budget.json

