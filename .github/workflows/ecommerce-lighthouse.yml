---

name: 🔦 Ecommerce Lighthouse

on:
  workflow_run:
    workflows: ["🚀 Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: 🔦 Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Wait for ecommerce to be ready
        run: |
          URL="https://${{ vars.APP_DOMAIN }}/api/health"
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && echo "✅ Ready." && exit 0
            sleep 10
          done
          echo "❌ Did not respond with 200 after 10 minutes." && exit 1

      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://${{ vars.APP_DOMAIN }}/
            https://${{ vars.APP_DOMAIN }}/products
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          budgetPath: apps/ecommerce/.lighthouse-budget.json
