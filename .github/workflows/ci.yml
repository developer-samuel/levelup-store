name: 🚀 LevelUp Store CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: ${{ vars.PHP_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  # ─── PHP Static Analysis & Linting ────────────────────────────────────────
  php-checks:
    name: 🧹 PHP Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Prepare environment
        run: cp .env.example .env

      - name: Composer Audit
        run: composer audit --no-dev

      - name: PHPStan
        run: composer php-stan

      - name: PHP Mess Detector
        run: composer php-md

      - name: Lint Twig
        run: php bin/console lint:twig templates/

      - name: Lint YAML
        run: php bin/console lint:yaml config/

      - name: Lint Container
        run: php bin/console lint:container

  # ─── Architecture Check ───────────────────────────────────────────────────
  deptrac:
    name: 🏗️ Architecture
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Run Deptrac
        run: |
          composer deptrac

  # ─── Assets Lint & Type Check ─────────────────────────────────────────────
  lint-assets:
    name: 🎨 Assets Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: pnpm Audit
        run: pnpm audit --prod --audit-level=high

      - name: TypeScript type check
        run: pnpm type-check

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint-scss

  # ─── PHPUnit Tests ────────────────────────────────────────────────────────
  phpunit:
    name: 🧪 PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [php-checks, deptrac]
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.3'        # production - required
          - php-version: '8.4'        # forward-compat - allowed to fail
            experimental: true
          - php-version: '8.5'        # forward-compat - allowed to fail
            experimental: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mercure:
        image: dunglas/mercure:v0.24.2
        env:
          SERVER_NAME: ':80'
          MERCURE_PUBLISHER_JWT_KEY: 'test-mercure-jwt-secret-256bit-ok'
          MERCURE_SUBSCRIBER_JWT_KEY: 'test-mercure-jwt-secret-256bit-ok'
          MERCURE_EXTRA_DIRECTIVES: "cors_origins *\nanonymous\n"
        ports:
          - 9300:80
        options: >-
          --health-cmd "nc -z localhost 80 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store_test
          db-port: '5432'
          db-password: secret

      - uses: ./.github/actions/elasticsearch
        with:
          elasticsearch-port: '9200'

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/rabbitmq
        with:
          rabbitmq-port: '5672'

      - uses: ./.github/actions/minio
        with:
          minio-port: '9000'

      - uses: ./.github/actions/mercure
        with:
          mercure-port: '9300'
          mercure-jwt-secret: 'test-mercure-jwt-secret-256bit-ok'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql, redis, pcov
          coverage: pcov

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          symfony-env: test
          with-fixtures: 'false'
          with-reindex: 'true'

      - name: Run PHPUnit
        run: composer php-unit

      - name: Show test log on failure
        if: failure()
        run: cat var/log/test.log 2>/dev/null || echo "No test log found"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: phpunit-reports-php${{ matrix.php-version }}
          path: var/tools/php-unit

  # ─── Vitest Frontend Tests ────────────────────────────────────────────────
  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Vitest
        run: pnpm vitest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vitest-coverage
          path: var/tools/vitest

  # ─── Playwright E2E Tests ─────────────────────────────────────────────────
  e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    needs: [phpunit, vitest]
    if: github.event_name != 'pull_request'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: levelup_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      elasticsearch:
        image: elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200/_cluster/health | grep -q status"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/postgres
        with:
          db-name: levelup_store
          db-port: '5432'
          db-password: secret

      - uses: ./.github/actions/elasticsearch
        with:
          elasticsearch-port: '9200'

      - uses: ./.github/actions/redis
        with:
          redis-port: '6379'

      - uses: ./.github/actions/rabbitmq
        with:
          rabbitmq-port: '5672'

      - uses: ./.github/actions/env
        with:
          source: .env.test

      - uses: ./.github/actions/php
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, redis

      - uses: ./.github/actions/node
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-flags: '--ignore-scripts'

      - name: Rebuild native modules
        run: pnpm rebuild esbuild @parcel/watcher

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          with-reindex: 'true'

      - name: Build Frontend
        run: pnpm build

      - name: Launch PHP server
        uses: ./.github/actions/launch
        with:
          health-check-path: /api/dev/health-check

      - name: Smoke test login API
        run: |
          echo "Testing login API..."
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:8000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"Test123@"}' \
            --max-time 10 || echo "CURL_FAILED")
          echo "Login API response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"status":"error"'; then
            echo "ERROR: Login API returned error status - check PHP log below"
            cat var/log/test.log 2>/dev/null || echo "No test.log found"
            exit 1
          fi

      - name: Run Playwright (Chromium - auth only)
        run: pnpm e2e assets/tests/e2e/specs/auth/login.spec.ts --project=chromium --grep "should redirect after successful login"

      - name: Show PHP log on failure
        if: failure()
        run: cat var/log/test.log 2>/dev/null || echo "No test.log found"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: var/tools/playwright

  # ─── Sentinel: single required status check ───────────────────────────────
  ci-pass:
    name: ✅ CI
    runs-on: ubuntu-latest
    needs: [php-checks, deptrac, lint-assets, phpunit, vitest]
    if: always()

    steps:
      - name: All required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi
          echo "All required jobs passed"
