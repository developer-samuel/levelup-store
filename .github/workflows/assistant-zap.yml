name: 🕷️ Assistant OWASP ZAP DAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/assistant/app/**'
      - 'apps/assistant/jobs/**'
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap:
    name: 🕷️ DAST scan
    runs-on: ubuntu-latest

    services:
      chromadb:
        image: chromadb/chroma:1.0.15
        ports:
          - 8002:8000
        options: >-
          --health-cmd "curl -sf http://localhost:8000/api/v2/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/python

      - uses: ./.github/actions/chromadb
        with:
          chromadb-port: '8002'

      - name: Copy env
        run: cp .env.example .env

      - name: Launch assistant API
        run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 &

      - name: Wait for assistant API
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 2
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8001'
          cmd_options: '-a'
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: report_html.html
