---

name: 🕷️ Assistant OWASP ZAP DAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/assistant/app/**'
      - 'apps/assistant/jobs/**'
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap:
    name: 🕷️ DAST scan
    runs-on: ubuntu-latest

    services:
      chromadb:
        image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
        ports:
          - 8002:8000
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3 && grep -q nanosecond <&3'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/setup-chromadb
        with:
          chromadb-port: '8002'

      - name: Copy env
        run: cp .env.example .env

      - name: Launch assistant API
        run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 &

      - name: Wait for assistant API
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 2
          done

      - uses: ./.github/actions/run-zap-scan
        with:
          target: 'http://127.0.0.1:8001'
          rules-file: 'apps/assistant/.zap-rules.tsv'
          artifact-name: zap-report-assistant
