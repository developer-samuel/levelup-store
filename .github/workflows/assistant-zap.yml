name: 🕷️ Assistant OWASP ZAP DAST

on:
  push:
    branches: [main]
    paths:
      - 'apps/assistant/app/**'
      - 'apps/assistant/jobs/**'
  schedule:
    - cron: '0 2 * * 1'   # Every Monday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap:
    name: 🕷️ DAST scan
    runs-on: ubuntu-latest

    services:
      chromadb:
        image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
        ports:
          - 8002:8000
        options: >-
          --health-cmd "nc -z localhost 8000 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    defaults:
      run:
        working-directory: apps/assistant

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/python

      - uses: ./.github/actions/chromadb
        with:
          chromadb-port: '8002'

      - name: Copy env
        run: cp .env.example .env

      - name: Launch assistant API
        run: uv run uvicorn app.main:app --host 127.0.0.1 --port 8001 &

      - name: Wait for assistant API
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 2
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://127.0.0.1:8001'
          cmd_options: '-a'
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-report
          path: report_html.html
