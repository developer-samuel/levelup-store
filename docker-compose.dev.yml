# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🧑‍💻 Dev-Only Services
#
# Extends docker-compose.yml with local development tools.
#
# Run with:
#   First time: make dev-setup-build
#   After:      make dev
# ──────────────────────────────────────────────────────────────────────────────────────────────

include:
  # ── Shared ────────────────────────────────────────────────────────────────────

  - docker/compose/services/_dev/dozzle.yml
  - docker/compose/services/_dev/sonarqube.yml

  # ── E-commerce ────────────────────────────────────────────────────────────────

  - apps/ecommerce/docker/compose/_dev/pgAdmin.yml
  - apps/ecommerce/docker/compose/_dev/elasticvue.yml
  - apps/ecommerce/docker/compose/_dev/mailpit.yml
  - apps/ecommerce/docker/compose/_dev/vite.yml

  # ── Assistant ─────────────────────────────────────────────────────────────────

  - apps/assistant/docker/compose/_dev/client.yml

# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🕸️ Networks & Volumes
# ──────────────────────────────────────────────────────────────────────────────────────────────

networks:
  app-network:
    driver: bridge

volumes:
  pgadmin_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_logs:
    driver: local
