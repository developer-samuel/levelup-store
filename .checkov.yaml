directory:
  - infrastructure/helm/apps
  - infrastructure/kubernetes
  - infrastructure/terraform
  - apps/ecommerce/docker
  - apps/assistant/docker
  - docker

framework:
  - terraform
  - kubernetes
  - helm
  - dockerfile

skip-path:
  # third-party Helm chart sub-dependencies committed under charts/ subdirectories
  - infrastructure/helm/.+/charts

skip-check:
  # third-party charts (velero, argocd, kube-prometheus-stack) require broad RoleBindings
  - CKV2_K8S_1
  - CKV2_K8S_2
  - CKV2_K8S_4
  - CKV2_K8S_5
  # false positive: Helm renders charts without namespace values; ArgoCD sets the real namespace at deploy time
  - CKV_K8S_21
  # app containers are managed by Kubernetes liveness/readiness probes, not Docker HEALTHCHECK
  - CKV_DOCKER_2
  # dev/build-stage Dockerfiles (vite, jenkins) have no USER; prod Dockerfiles already set USER
  - CKV_DOCKER_3
  # seccomp and securityContext are enforced via Kyverno policies, not Helm chart annotations
  - CKV_K8S_31
  - CKV_K8S_29
  # imagePullPolicy: Always is not required - images are pinned to digest via Cosign
  - CKV_K8S_15
  # OCI free tier - CMK, versioning, events and backup are not available/applicable
  - CKV_OCI_2
  - CKV_OCI_3
  - CKV_OCI_4
  - CKV_OCI_5
  - CKV_OCI_7
  - CKV_OCI_8
  - CKV_OCI_9
  # secrets injected via secretRef (env vars) - Vault injects them at runtime, not stored in plaintext
  - CKV_K8S_35
  # automountServiceAccountToken not explicitly disabled - no SA token needed and default is false in k8s 1.24+
  - CKV_K8S_38
  # runAsUser: 1000 - intentional; check requires >10000 but our base images use UID 1000
  - CKV_K8S_40
  # migrate/reindex jobs need write access to filesystem (Doctrine migrations, Elasticsearch index)
  - CKV_K8S_22
  # worker and scheduler Deployments use process-level health checks, not HTTP probes
  - CKV_K8S_8
  - CKV_K8S_9
  # reindex job runs as non-root (runAsNonRoot: true) but without explicit runAsUser
  - CKV_K8S_23
  # chromadb uses default capabilities; NET_RAW drop not supported by the upstream image
  - CKV_K8S_28
  # chromadb upstream image does not support allowPrivilegeEscalation: false
  - CKV_K8S_20
  # chromadb and third-party infra pods have no securityContext - upstream limitation
  - CKV_K8S_30
  - CKV_K8S_37
  # NetworkPolicy is defined per-namespace via Kyverno; individual pod annotations not required
  - CKV2_K8S_6
  # image digest pinning for third-party infra images (chromadb, loki-helm-test); app images use digest via Cosign
  - CKV_K8S_43
  # resource limits for infra/observability pods set by upstream charts; our app pods have limits set
  - CKV_K8S_10
  - CKV_K8S_11
  - CKV_K8S_12
  - CKV_K8S_13
  # image tag latest in third-party helm test pods (loki-helm-test) - upstream chart, not our code
  - CKV_K8S_14
  # ClusterRole webhook permissions required by kube-prometheus-stack and KEDA operators
  - CKV_K8S_155
  # velero requires wildcard RBAC to backup/restore arbitrary resources
  - CKV_K8S_49
  - CKV_K8S_157
  - CKV_K8S_158
  # velero RoleBinding impersonate check - required for backup/restore operations
  - CKV2_K8S_3
