schemaVersion: '2.0.0'

commandTests:
  - name: Python is installed
    command: python
    args: [--version]
    expectedOutput: [Python 3.12]

  - name: UV is installed
    command: uv
    args: [--version]
    expectedOutput: [uv]

  - name: Working directory is /app
    command: pwd
    expectedOutput: [/app]

fileExistenceTests:
  - name: Entrypoint script exists
    path: /usr/local/bin/scripts/run.sh
    shouldExist: true
    permissions: '-rwxr-xr-x'

  - name: App directory exists
    path: /app/app
    shouldExist: true

  - name: Jobs directory exists
    path: /app/jobs
    shouldExist: true

metadataTest:
  entrypoint: ['/usr/local/bin/scripts/run.sh']
  workdir: /app
  exposedPorts: ['8001']
