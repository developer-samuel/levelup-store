services:
  assistant_ollama:
    image: ollama/ollama:latest
    container_name: levelup_store_assistant_ollama
    profiles: [ollama]
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
    driver: local
