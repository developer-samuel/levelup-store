# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🟨 Dev Tool - Assistant Client (Vite dev server)
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  assistant_client:
    build:
      context: ${PWD}/apps/assistant/docker/config/_dev
      dockerfile: Dockerfile.vite
    container_name: levelup_store_assistant_client
    working_dir: /var/www
    command: sh -c "pnpm rebuild rollup @rollup/rollup-linux-x64-gnu && pnpm --filter assistant dev"
    volumes:
      - ${PWD}:/var/www
    ports:
      - '5174:5174'
    networks:
      - app-network
    depends_on:
      - assistant_app
