# ── Dependencies ───────────────────────────────────────────────────────────────

[project]
name = "levelup-store-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.32.1",
    "ollama==0.4.4",
    "pydantic-settings==2.6.1",
    "chromadb==1.5.9",
    "numpy==2.2.1",
    "psycopg2-binary==2.9.10",
    "slowapi==0.1.9",
    "redis==5.2.1",
    "aio-pika==9.5.5",
    "httpx>=0.27.0,<0.28.0",
    "sentry-sdk[fastapi]==2.19.2",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "google-genai>=1.2.0",
    "pypdf>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "mypy==1.14.0",
    "vulture==2.14",
    "types-psycopg2==2.9.21.20250516",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.4",
]

# ── Quality tools ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"   # minimum Python version to target
line-length = 100          # max line length
cache-dir = "/tmp/.ruff_cache"

[tool.ruff.lint.isort]
known-first-party = ["app", "jobs"]

[tool.ruff.lint]
select = [
    "E",   # PEP 8 style errors (indentation, whitespace, ...)
    "F",   # Pyflakes (unused imports, undefined variables, ...)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (use modern Python syntax)
]

[tool.mypy]
python_version = "3.12"
strict = true  # enforce type annotations on all functions
plugins = ["pydantic.mypy"]
cache_dir = "/tmp/.mypy_cache"

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires a running database"]
addopts = "-p no:cacheprovider --cov=app --cov=jobs --cov-report=term-missing"

[tool.coverage.run]
data_file = "/tmp/.coverage"

[tool.vulture]
min_confidence = 80
paths = ["app/"]
ignore_decorators = ["@router.get", "@router.post", "@router.put", "@router.delete", "@app.get", "@app.post"]
ignore_names = ["request", "cls"]
