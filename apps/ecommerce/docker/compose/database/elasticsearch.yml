# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🔍 Search - Elasticsearch
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  ecommerce_elasticsearch:
    image: elasticsearch:8.17.0
    container_name: levelup_store_ecommerce_elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      http.cors.enabled: "true"
      http.cors.allow-origin: "'*'"
      http.cors.allow-headers: "Authorization,X-Requested-With,Content-Type,Content-Length"
    ports:
      - '${ELASTICSEARCH_PORT}:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      app-network:
        aliases:
          - elasticsearch
    extends:
      file: ${PWD}/docker/compose/healthcheck.yml
      service: healthcheck
    healthcheck:
      test: ['CMD-SHELL', 'curl -f "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s" || exit 1']
      start_period: 120s
