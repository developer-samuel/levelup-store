# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🗄️ Storage - MinIO (S3-compatible Object Storage)
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  ecommerce_minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: levelup_store_ecommerce_minio
    restart: unless-stopped
    user: root
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DATA_DIR: /data
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      app-network:
        aliases:
          - minio
    extends:
      file: ${PWD}/docker/compose/healthcheck.yml
      service: healthcheck
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
