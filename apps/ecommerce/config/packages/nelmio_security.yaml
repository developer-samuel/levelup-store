nelmio_security:
  # prevents framing of the entire site
  clickjacking:
    paths:
      '^/.*': DENY

  referrer_policy:
    enabled: true
    policies:
      - 'no-referrer'
      - 'strict-origin-when-cross-origin'

  csp:
    enabled: true
    hosts: []
    content_types: []
    compat_headers: false
    enforce:
      level1_fallback: false
      browser_adaptive:
        enabled: false
      default-src:
        - 'self'
      script-src:
        - 'self'
        - "'unsafe-inline'"
        - 'https://js.stripe.com'
        - 'https://challenges.cloudflare.com'
      style-src:
        - 'self'
        - "'unsafe-inline'"
      font-src:
        - 'self'
      img-src:
        - 'self'
        - "'data:'"
        - 'https:'
        - 'http://localhost:*'
        - 'http://127.0.0.1:*'
      connect-src:
        - 'self'
        - 'https://api.stripe.com'
        - 'https:'
        - 'http://localhost:*'
        - 'http://127.0.0.1:*'
      frame-src:
        - 'https://js.stripe.com'
        - 'https://challenges.cloudflare.com'
      object-src:
        - "'none'"
      base-uri:
        - 'self'
      form-action:
        - 'self'
      frame-ancestors:
        - "'none'"

  cross_origin_isolation:
    enabled: true
    paths:
      '^/(?!login|signup|forgot-password|reset-password|change-password).*': ~

