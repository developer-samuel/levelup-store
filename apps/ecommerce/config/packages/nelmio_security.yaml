nelmio_security:
  # prevents framing of the entire site
  clickjacking:
    paths:
      '^/.*': DENY

  # disables content type sniffing for script resources
  content_type:
    nosniff: true

  referrer_policy:
    enabled: true
    policies:
      - 'no-referrer'
      - 'strict-origin-when-cross-origin'

  csp:
    enabled: true
    hosts: []
    content_types: []
    enforce:
      level1_fallback: false
      browser_adaptive:
        enabled: false
      default-src:
        - 'self'
      script-src:
        - 'self'
        - 'unsafe-inline'
      style-src:
        - 'self'
        - 'unsafe-inline'
        - 'https://fonts.googleapis.com'
      font-src:
        - 'self'
        - 'https://fonts.gstatic.com'
      img-src:
        - 'self'
        - 'data:'
        - 'https:'
      connect-src:
        - 'self'
        - 'https:'
      frame-ancestors:
        - 'none'
      form-action:
        - 'self'

  cross_origin_isolation:
    enabled: true

  permissions_policy:
    enabled: true
    policies:
      camera: []
      microphone: []
      geolocation: []
      payment: []
