nelmio_security:
  # prevents framing of the entire site
  clickjacking:
    paths:
      '^/.*': DENY

  # disables content type sniffing for script resources
  content_type:
    nosniff: true

  referrer_policy:
    enabled: true
    policies:
      - 'no-referrer'
      - 'strict-origin-when-cross-origin'

  csp:
    enabled: true
    hosts: []
    content_types: []
    compat_headers: false
    enforce:
      level1_fallback: false
      browser_adaptive:
        enabled: false
      default-src:
        - 'self'
      script-src:
        - 'self'
        - 'https://challenges.cloudflare.com'
      style-src:
        - 'self'
      font-src:
        - 'self'
      img-src:
        - 'self'
        - 'data:'
      connect-src:
        - 'self'
        - '%env(MERCURE_PUBLIC_ORIGIN)%'
      frame-src:
        - 'https://challenges.cloudflare.com'
      frame-ancestors:
        - 'none'
      form-action:
        - 'self'

  cross_origin_isolation:
    enabled: true
    paths:
      '^/(?!login|signup|forgot-password|reset-password|change-password).*': ~

  permissions_policy:
    enabled: true
    policies:
      camera: []
      microphone: []
      geolocation: []
      payment: []
