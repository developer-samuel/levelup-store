monolog:
  channels: ['deprecation', 'app_logger']

when@dev:
  monolog:
    handlers:
      sentry: &sentry-handler
        type: sentry
        level: warning
        hub_id: Sentry\State\HubInterface

      main: &main-handler
        type: stream
        path: '%kernel.logs_dir%/%kernel.environment%.log'
        level: debug
        channels: ['!event']

      console: &console-handler
        type: console
        process_psr_3_messages: false
        channels: ['!event', '!doctrine', '!console']

      security: &security-handler
        type: stream
        path: '%kernel.logs_dir%/security.log'
        level: info
        channels: ['security']

      app_logger: &app-logger-handler
        type: stream
        path: '%kernel.logs_dir%/app.log'
        level: debug
        channels: ['app_logger']

when@local:
  monolog:
    handlers:
      sentry: *sentry-handler
      main: *main-handler
      console: *console-handler
      security: *security-handler
      app_logger: *app-logger-handler

when@test:
  monolog:
    handlers:
      main:
        type: fingers_crossed
        action_level: error
        handler: nested
        excluded_http_codes: [404, 405]
        channels: ['!event']

      nested:
        type: stream
        path: '%kernel.logs_dir%/%kernel.environment%.log'
        level: debug

when@prod:
  monolog:
    handlers:
      main:
        type: fingers_crossed
        action_level: error
        handler: nested
        excluded_http_codes: [404, 405]
        buffer_size: 50 # How many messages should be saved? Prevent memory leaks

      nested:
        type: stream
        path: php://stderr
        level: debug
        formatter: monolog.formatter.json

      console:
        type: console
        process_psr_3_messages: false
        channels: ['!event', '!doctrine']

      deprecation:
        type: stream
        channels: [deprecation]
        path: php://stderr
        formatter: monolog.formatter.json

      security:
        type: stream
        path: '%kernel.logs_dir%/security.log'
        level: info
        channels: ['security']

      app_logger:
        type: stream
        path: '%kernel.logs_dir%/app.log'
        level: debug
        channels: ['app_logger']
