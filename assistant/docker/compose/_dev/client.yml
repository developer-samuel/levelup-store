# ──────────────────────────────────────────────────────────────────────────────────────────────
# 🟨 Dev Tool - Assistant Client (Vite dev server)
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  assistant_client:
    build:
      context: ${PWD}/assistant/docker/config/_dev
      dockerfile: Dockerfile.vite
    container_name: levelup_store_assistant_client
    working_dir: /app
    command: sh -c "pnpm install && pnpm dev"
    volumes:
      - ${PWD}/assistant/client:/app
    ports:
      - '5174:5174'
    networks:
      - app-network
    depends_on:
      - assistant
