# ──────────────────────────────────────────────────────────────────────────────────────────────
# ⚙️ Assistant Worker - RabbitMQ consumer + Redis pub/sub streamer
# ──────────────────────────────────────────────────────────────────────────────────────────────

services:
  assistant_worker:
    build:
      context: ${PWD}/assistant
      dockerfile: Dockerfile
    container_name: levelup_store_assistant_worker
    restart: unless-stopped
    command: ['python', '-m', 'jobs.worker']
    env_file:
      - ${PWD}/assistant/.env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
