sonar.projectKey=levelup-store
sonar.projectName=LevelUp Store
sonar.organization=developer-samuel

sonar.sources=apps/ecommerce/src,apps/ecommerce/assets/ts,apps/assistant
sonar.tests=apps/ecommerce/tests

sonar.exclusions=\
    node_modules/**,\
    dist/**,\
    apps/ecommerce/vendor/**,\
    apps/assistant/venv/**,\
    apps/ecommerce/var/**,\
    apps/ecommerce/database/migrations/**

sonar.php.coverage.reportPaths=apps/ecommerce/var/tools/php-unit/coverage.xml

sonar.javascript.lcov.reportPaths=apps/ecommerce/var/tools/vitest/coverage/lcov.info

sonar.eslint.reportPaths=apps/ecommerce/var/tools/eslint/report.json
